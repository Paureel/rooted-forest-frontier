name: Research task
description: Propose one concrete research scope.
labels: ["research"]
body:
  - type: textarea
    id: claim
    attributes:
      label: Exact object, domain and claim
      description: State k/q conventions, target/pin and the unmet implication.
    validations:
      required: true
  - type: textarea
    id: predecessors
    attributes:
      label: Sources and overlap
      description: Pin the source commit/hashes and related issues, discussions or archived attempts.
    validations:
      required: true
  - type: textarea
    id: consumer
    attributes:
      label: Consuming algorithm call
      description: Explain how the claim changes coverage, correctness or fully paid work.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Controls and bounded first experiment
      description: Name known answers, corruptions, clean twins, failure criteria and pilot budget.
    validations:
      required: true

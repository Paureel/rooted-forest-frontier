name: Attribution correction
description: Correct credit or a third-party notice.
labels: ["attribution"]
body:
  - type: textarea
    id: location
    attributes:
      label: Affected source or claim
      description: Link the exact path, source version or PR.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction and supporting source
      description: Identify the original contributor or notice and provide a primary source.
    validations:
      required: true
